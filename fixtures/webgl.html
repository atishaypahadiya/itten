<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A scene that draws every frame</title>
<style>
  /* In px, so the 200% text pass adds no overflow of its own. */
  body { margin: 0; font: 16px/24px system-ui, sans-serif; color: #111; background: #fff; }
  .scene { position: relative; height: 480px; }
  .scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .scene h1 { position: absolute; left: 32px; top: 192px; margin: 0; font-size: 32px; line-height: 40px; color: #fff; }
  .narrow { position: absolute; left: 32px; top: 288px; width: 96px; margin: 0; white-space: nowrap; color: #111; background: #eee; }
</style>
</head>
<body>
  <!-- scripts/frozen-test.js. A WebGL scene redrawn on every animation frame by a fragment shader that
       loops per pixel, so a software renderer (SwiftShader, on a machine without a GPU) spends most of a
       second on each frame. Its colour depends only on how many frames have been drawn, never on the
       clock, so a given frame draws the same pixels on every load. -->
  <div class="scene">
    <canvas></canvas>
    <h1 class="over">Text over a scene that never holds still</h1>
    <!-- A line too long for its painted box, over the scene: an overflow error whose crop shows the scene. -->
    <p class="narrow">This line runs out of its narrow box</p>
  </div>
  <script>
    const c = document.querySelector('canvas');
    const gl = c.getContext('webgl');
    const size = () => { c.width = c.clientWidth; c.height = c.clientHeight; gl.viewport(0, 0, c.width, c.height); };
    const shader = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
    const prog = gl.createProgram();
    gl.attachShader(prog, shader(gl.VERTEX_SHADER, 'attribute vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }'));
    gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, `precision mediump float;
      uniform float f; uniform vec2 r;
      void main() {
        vec2 q = gl_FragCoord.xy / r;
        float v = 0.0;
        for (int i = 0; i < 1600; i++) { float k = float(i); v += sin(q.x * (3.0 + k * 0.01) + f * 0.05 + k) * cos(q.y * (2.0 + k * 0.02) - f * 0.03); }
        v = v / 1600.0;
        gl_FragColor = vec4(0.55 + 0.25 * v, 0.6 + 0.2 * sin(f * 0.02), 0.7 + 0.2 * v, 1.0);
      }`));
    gl.linkProgram(prog); gl.useProgram(prog);
    const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    const uf = gl.getUniformLocation(prog, 'f'), ur = gl.getUniformLocation(prog, 'r');
    let frame = 0;
    const draw = () => {
      if (c.width !== c.clientWidth || c.height !== c.clientHeight) size();
      gl.uniform1f(uf, frame++); gl.uniform2f(ur, c.width, c.height);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      requestAnimationFrame(draw);
    };
    requestAnimationFrame(draw);
  </script>
</body>
</html>

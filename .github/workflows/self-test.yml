# Runs the ITTEN action from this checkout against the fixtures, on every push
# and pull request, and fails unless it reproduces the fixture test: every
# planted defect caught, nothing else reported, nothing on the clean twins.
name: Self-test

# No path or branch filter: main's required checks (checks, fixtures) must
# report on every commit, and an unfiltered push covers main and v* tags.
# The rule shared with the other specialists is "at least every non-Markdown
# change"; this is more (scripts/ci-test.js holds it).
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixtures:
    runs-on: ubuntu-24.04
    # The default sweep, as the action's quick mode (ITTEN.md), then the fixtures once more with Firefox.
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Inspect the test print and its clean twin
        id: system
        uses: ./
        with:
          static-dir: .
          pages: |
            fixtures/index.html
            fixtures/clean.html
          system: fixtures/itten.system.json
          baseline: fixtures/itten-baseline.json
          fail-on: never
          name: itten-fixtures

      - name: Inspect the distinct-value pair without a system
        id: distinct
        uses: ./
        with:
          static-dir: .
          pages: |
            fixtures/distinct.html
            fixtures/distinct-clean.html
          system: none
          baseline: fixtures/itten-baseline.json
          fail-on: never
          name: itten-fixtures-distinct

      - name: Score the action's reports against the planted defects
        env:
          SYSTEM_REPORTS: ${{ steps.system.outputs.report-dir }}
          DISTINCT_REPORTS: ${{ steps.distinct.outputs.report-dir }}
        run: node scripts/fixture-test.js --from "$SYSTEM_REPORTS" --from "$DISTINCT_REPORTS"

      # Firefox, in this job only. The action installs and asks for WebKit alone, for every project that uses it;
      # here the fixtures are inspected once more by the inspector itself with WebKit and Firefox, so the Firefox
      # pass has a run behind it (Linux; on macOS 27.2 Playwright's Firefox does not start). The step fails if
      # Firefox does not run, a planted defect is missed, or anything else is reported.
      - name: Install Firefox for the self-test
        run: npx playwright install --with-deps firefox
      - name: The fixtures again, in WebKit and Firefox
        run: node scripts/fixture-test.js --need webkit,firefox
      - name: Upload the reports of the Firefox run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: itten-fixtures-engines
          path: |
            dist/fixtures/*/report.json
            dist/fixtures/result.json
          if-no-files-found: warn
          overwrite: true

  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Action tests
        run: node scripts/action-test.js
      - name: The skill matches the repository and runs from a copy
        run: node scripts/skill-test.js
      - name: The workflow runs on every push and pull request
        run: node scripts/ci-test.js
